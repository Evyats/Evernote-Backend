services:
  db:
    image: postgres:16
    # preferably comment this so that docker can auto generate a name
    # container_name: postgres_container
    environment:
      POSTGRES_USER: postgres_username
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data